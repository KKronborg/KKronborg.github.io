<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crime Map</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Inter', sans-serif;
    background:#1a1a2e;
    color:#eaeaea;
    transition: 0.3s;
}

/* NAVBAR */
nav {
    display:flex;
    justify-content:space-between;
    align-items: center;
    padding:15px 40px;
    background:#111;
    position: sticky;
    top: 0;
    z-index: 1000;
}

nav a {
    color:#16c79a;
    text-decoration:none;
    margin-left:20px;
    font-weight:500;
}

nav a.active {
    color:white;
}

nav button {
    margin-left:20px;
    background:none;
    border:1px solid #16c79a;
    color:#16c79a;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
}

nav button:hover {
    background:#16c79a;
    color:black;
}

/* CONTENT */
.container {
    max-width:900px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
}

iframe {
    width:100%;
    border-radius:12px;
    transition:0.3s;
}

iframe:hover {
    transform:scale(1.01);
}

/* LIGHT MODE */
.light-mode {
    background:#ffffff;
    color:#111;
}

.light-mode nav {
    background:#eee;
}

.light-mode nav a {
    color:#0077cc;
}

.light-mode nav a.active {
    color:black;
}

.light-mode .container {
    color:#111;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
<div>SF Crime Analysis</div>
<div>
<a href="index.html">Home</a>
<a href="hourly.html">Hourly</a>
<a href="map.html" class="active">Map</a>
<button onclick="toggleMode()">🌙</button>
</div>
</nav>

<!-- CONTENT -->
<div class="container">

<h1>Crime Heatmap</h1>

<p>Explore where crime incidents are concentrated across San Francisco.</p>

<iframe src="Plots/visualizations/sf_crime_heatmap.html" height="600"></iframe>

</div>

<!-- SCRIPT -->
<script>
function toggleMode() {
    document.body.classList.toggle("light-mode");
}
</script>

</body>
</html>
